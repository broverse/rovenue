name: Release images

# Tagged releases only. These are multi-arch builds, and the upgrade
# runbook pins versions rather than commits, so there is nothing for a
# per-push build to serve.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. v1.2.0"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: broverse

jobs:
  build:
    name: build ${{ matrix.image.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: rovenue-api, dockerfile: apps/api/Dockerfile, context: ".", build_args: "" }
          # ROVENUE_REQUIRE_RUNTIME_CONFIG=1 makes the dashboard entrypoint
          # refuse to start with ROVENUE_API_URL unset — correct for a
          # published image (whose baked-in VITE_API_URL default is
          # meaningless), wrong for the other images, which don't have this
          # build arg at all. (rovenue-docs is built in the separate
          # build-docs job below, not this matrix — see its comment.)
          - {
              name: rovenue-dashboard,
              dockerfile: apps/dashboard/Dockerfile,
              context: ".",
              build_args: "ROVENUE_REQUIRE_RUNTIME_CONFIG=1",
            }
          - {
              name: rovenue-postgres,
              dockerfile: deploy/postgres/Dockerfile,
              context: "deploy/postgres",
              build_args: "",
            }
        platform: [linux/amd64, linux/arm64]
        # Native runners, not QEMU: pnpm install + vite build under emulated
        # arm64 runs into tens of minutes and turns a release into an
        # afternoon.
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # workflow_dispatch has no tag ref of its own — without this, a manual
      # dispatch builds the default branch's HEAD while the manifest job
      # below labels and signs the result as the dispatched tag. That's a
      # signed, attested image whose provenance points at a commit that
      # isn't the tag, and it silently overwrites a genuine tag's image if
      # one already exists.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.build_args }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform }}

      # A gate, not a report. The sharp >= 0.35.3 floor
      # (CVE-2026-33327/33328/35590/35591, GIF/TIFF/VIPS loaders) is a
      # standing obligation; this is what turns it into an enforced one.
      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > \
            "/tmp/digests/${{ matrix.image.name }}-$(echo '${{ matrix.platform }}' | tr / -)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.image.name }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # rovenue-docs can't sit in the `build` matrix above: its Dockerfile
  # requires six SDK API-reference artifacts (rustdoc/DocC/Dokka/TypeDoc x2/
  # dartdoc) to already be under apps/docs/public/api/<sdk>/ in the build
  # context — generated on runners that can actually build each toolchain
  # (DocC needs macOS+Xcode, Dokka needs a JVM, dartdoc needs Flutter — see
  # sdk-docs.yml), not on the ubuntu/arm runners this matrix uses. This job
  # calls that workflow, downloads its six artifacts into place, and only
  # then runs the same build/scan/digest sequence as the `build` job above.
  sdk-docs:
    name: Generate SDK docs
    uses: ./.github/workflows/sdk-docs.yml

  build-docs:
    name: build rovenue-docs (${{ matrix.platform }})
    needs: sdk-docs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Each sdk-docs-<sdk> artifact lands in its own subdirectory named
      # after the artifact (merge-multiple: false, the default) — exactly
      # the apps/docs/public/api/<sdk>/ layout the Dockerfile expects, once
      # the "sdk-docs-" prefix is stripped below.
      - name: Download generated SDK references
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sdk-docs-*
          path: apps/docs/public/api

      - name: Lay out apps/docs/public/api/<sdk>/
        run: |
          set -euo pipefail
          cd apps/docs/public/api
          for d in sdk-docs-*/; do
            d="${d%/}"
            mv "$d" "${d#sdk-docs-}"
          done
          ls -la .

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "."
          file: apps/docs/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/rovenue-docs,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=rovenue-docs-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rovenue-docs-${{ matrix.platform }}

      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/rovenue-docs@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > \
            "/tmp/digests/rovenue-docs-$(echo '${{ matrix.platform }}' | tr / -)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-rovenue-docs-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: manifest ${{ matrix.image }}
    needs: [build, build-docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [rovenue-api, rovenue-dashboard, rovenue-docs, rovenue-postgres]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF#refs/tags/}"
          MINOR="$(echo "${VERSION#v}" | cut -d. -f1,2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          # The trigger (tags: ["v*.*.*"]) also matches a prerelease like
          # v1.0.0-rc1. The floating X.Y and latest tags are what an
          # unpinned Coolify one-click install resolves to, so a prerelease
          # must publish ONLY its exact vX.Y.Z tag — never move those.
          case "$VERSION" in
          *-*) echo "floating_tags=false" >> "$GITHUB_OUTPUT" ;;
          *) echo "floating_tags=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create and push the multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}"
          DIGESTS=""
          for f in /tmp/digests/${{ matrix.image }}-*; do
            DIGESTS="$DIGESTS ${IMAGE}@$(cat "$f")"
          done
          TAG_ARGS="-t ${IMAGE}:${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.floating_tags }}" = "true" ]; then
            TAG_ARGS="$TAG_ARGS -t ${IMAGE}:${{ steps.version.outputs.minor }} -t ${IMAGE}:latest"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAG_ARGS $DIGESTS
          docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless, via the workflow's GitHub OIDC identity. An operator
      # verifies with the command in docs/operations/deployment.md, which
      # names this repository and workflow as the expected identity.
      - name: Sign the published tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}"
          TAGS="${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.floating_tags }}" = "true" ]; then
            TAGS="$TAGS ${{ steps.version.outputs.minor }} latest"
          fi
          for TAG in $TAGS; do
            DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
            cosign sign --yes "${IMAGE}@${DIGEST}"
          done
