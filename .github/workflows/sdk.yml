name: SDK

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/core-rs/**"
      - "packages/sdk-swift/**"
      - "packages/sdk-kotlin/**"
      - "packages/sdk-rn/**"
      - "packages/sdk-flutter/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/sdk.yml"

jobs:
  rust-core:
    name: Rust core (test + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  bindgen-host:
    name: UniFFI bindgen (host)
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - run: ./packages/core-rs/scripts/build-bindings.sh
      - name: Confirm Swift binding emitted
        run: ls packages/sdk-swift/Sources/Rovenue/Generated/RovenueFFI.swift
      - name: Confirm Kotlin binding emitted
        run: ls packages/sdk-kotlin/src/main/kotlin/dev/rovenue/sdk/generated/librovenue.kt
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-linux
          path: |
            packages/sdk-swift/Sources/Rovenue/Generated
            packages/sdk-kotlin/src/main/kotlin/dev/rovenue/sdk/generated
            target/release/librovenue.so

  swift:
    name: Swift façade
    runs-on: macos-14
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # config-version-parity.sh evaluates Rovenue.podspec and
      # rovenue_flutter_ios.podspec with cocoapods-core instead of
      # pattern-matching them (Rovenue.podspec derives its version from
      # release.config.json, so a regex would only re-read that file). This job
      # installs CocoaPods nowhere else, and the parity check is its FIRST
      # step — without this, an image whose ruby lacks the gem fails the whole
      # Swift job with a LoadError on a check unrelated to what it tests.
      - name: Ensure cocoapods-core is available
        run: ruby -rcocoapods-core -e '' 2>/dev/null || gem install cocoapods-core --no-document
      - name: Version parity (config / Cargo / podspecs / RN package)
        run: ./packages/sdk-swift/Tests/config-version-parity.sh
      # Builds the bindings and all five Apple slices, then asserts the
      # artifact's shape. Replaces the previous DYLD_LIBRARY_PATH hop into
      # target/release, which only ever worked for the host platform.
      - name: Build RovenueFFI.xcframework
        run: ./packages/sdk-swift/scripts/build-xcframework.sh
      - name: swift test
        working-directory: packages/sdk-swift
        run: swift test

  kotlin:
    name: Kotlin façade (JVM)
    runs-on: ubuntu-latest
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: ./packages/core-rs/scripts/build-bindings.sh
      - name: gradle test
        working-directory: packages/sdk-kotlin
        run: gradle test --no-daemon

  web:
    name: Web SDK (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rovenue/web-sdk exec tsc --noEmit -p tsconfig.json
      # Build BEFORE the tests: the bundle budget measures the published
      # artifact, not the source, and a source-only run would silently skip
      # the check that catches a careless dependency.
      - run: pnpm --filter @rovenue/web-sdk build
      - run: pnpm --filter @rovenue/web-sdk test

  rn:
    name: RN façade (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rovenue/react-native-sdk test
      - run: pnpm --filter @rovenue/react-native-sdk build

  flutter:
    name: Flutter façade (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter --version
      - name: Analyze + test each package
        run: |
          for p in rovenue_flutter_platform_interface rovenue_flutter rovenue_flutter_ios rovenue_flutter_android; do
            (
              cd packages/sdk-flutter/$p
              flutter pub get
              flutter analyze
              # rovenue_flutter_ios/_android have no test/ dir yet; `flutter
              # test` exits 1 (not 0) with "Test directory \"test\" not
              # found." on a package with none, so skip cleanly rather than
              # let the loop fail on a package that has nothing to test.
              if [ -d test ]; then
                flutter test
              else
                echo "no test/ directory for $p — skipping flutter test"
              fi
            ) || exit 1
          done
      - name: Analyze + test the example app
        working-directory: packages/sdk-flutter/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
          # integration_test needs a device; flutter-tester is the headless
          # one every runner has (it is also how these were run locally).
          flutter test -d flutter-tester integration_test

  # The plugin's NATIVE sources. `flutter analyze` above is a Dart analyzer —
  # it never compiles a line of HostApiImpl.kt or HostApiImpl.swift, so
  # without the two jobs below the Kotlin/Swift halves of this SDK (and their
  # unit tests) ship unbuilt. See spec §7 acceptance criterion 3.
  flutter-android-native:
    name: Flutter plugin (Android/Kotlin)
    runs-on: ubuntu-latest
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # The plugin module resolves the Flutter embedding artifact from
      # $FLUTTER_ROOT/bin/internal/engine.version (see its build.gradle), and
      # the composite build in its settings.gradle pulls packages/sdk-kotlin,
      # which needs the generated UniFFI bindings.
      - run: ./packages/core-rs/scripts/build-bindings.sh
      - name: gradle test (plugin unit tests)
        working-directory: packages/sdk-flutter/rovenue_flutter_android/android
        run: ./gradlew test --no-daemon --console=plain
      - name: Build the example's debug APK
        working-directory: packages/sdk-flutter/example
        run: flutter build apk --debug

  flutter-ios-native:
    name: Flutter plugin (iOS/Swift)
    runs-on: macos-14
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # ios/Package.swift links FlutterMacOS.xcframework out of the Flutter
      # SDK cache; precache puts it there on a cold runner.
      - run: flutter precache --macos
      # ios/Package.swift depends on `packages/sdk-swift`, whose Package.swift
      # resolves RovenueFFI through `.binaryTarget(path:)`. That artifact is a
      # gitignored build product, so on a clean checkout SwiftPM aborts before
      # compiling anything: "local binary target 'RovenueFFI' … does not
      # contain a binary artifact". This script also regenerates the uniffi
      # bindings, which is why build-bindings.sh is no longer a separate step.
      - name: Build RovenueFFI.xcframework
        run: ./packages/sdk-swift/scripts/build-xcframework.sh
      - name: swift test (plugin unit tests)
        working-directory: packages/sdk-flutter/rovenue_flutter_ios/ios
        run: swift test
      # This job builds and runs the plugin's Swift unit tests; it does not
      # build the example app for iOS. Whether to add `flutter build ios` here
      # is an open decision, not a blocked one.
