name: SDK

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/core-rs/**"
      - "packages/sdk-swift/**"
      - "packages/sdk-kotlin/**"
      - "packages/sdk-rn/**"
      - "packages/sdk-flutter/**"
      - "examples/ios-swift/**"
      - "examples/android-kotlin/**"
      - "examples/sample-rn-expo/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/sdk.yml"

jobs:
  rust-core:
    name: Rust core (test + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  bindgen-host:
    name: UniFFI bindgen (host)
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - run: ./packages/core-rs/scripts/build-bindings.sh
      - name: Confirm Swift binding emitted
        run: ls packages/sdk-swift/Sources/Rovenue/Generated/RovenueFFI.swift
      - name: Confirm Kotlin binding emitted
        run: ls packages/sdk-kotlin/src/main/kotlin/dev/rovenue/sdk/generated/librovenue.kt
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-linux
          path: |
            packages/sdk-swift/Sources/Rovenue/Generated
            packages/sdk-kotlin/src/main/kotlin/dev/rovenue/sdk/generated
            target/release/librovenue.so

  swift:
    name: Swift façade
    runs-on: macos-14
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # config-version-parity.sh evaluates Rovenue.podspec and
      # rovenue_flutter_ios.podspec with cocoapods-core instead of
      # pattern-matching them (Rovenue.podspec derives its version from
      # release.config.json, so a regex would only re-read that file). This job
      # installs CocoaPods nowhere else, and the parity check is its FIRST
      # step — without this, an image whose ruby lacks the gem fails the whole
      # Swift job with a LoadError on a check unrelated to what it tests.
      - name: Ensure cocoapods-core is available
        run: ruby -rcocoapods-core -e '' 2>/dev/null || gem install cocoapods-core --no-document
      - name: Version parity (config / Cargo / podspecs / RN package)
        run: ./packages/sdk-swift/Tests/config-version-parity.sh
      # Builds the bindings and all five Apple slices, then asserts the
      # artifact's shape. Replaces the previous DYLD_LIBRARY_PATH hop into
      # target/release, which only ever worked for the host platform.
      - name: Build RovenueFFI.xcframework
        run: ./packages/sdk-swift/scripts/build-xcframework.sh
      - name: swift test
        working-directory: packages/sdk-swift
        run: swift test

  kotlin:
    name: Kotlin façade (JVM)
    runs-on: ubuntu-latest
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: ./packages/core-rs/scripts/build-bindings.sh
      - name: gradle test
        working-directory: packages/sdk-kotlin
        run: gradle test --no-daemon

  web:
    name: Web SDK (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rovenue/web-sdk exec tsc --noEmit -p tsconfig.json
      # Build BEFORE the tests: the bundle budget measures the published
      # artifact, not the source, and a source-only run would silently skip
      # the check that catches a careless dependency.
      - run: pnpm --filter @rovenue/web-sdk build
      - run: pnpm --filter @rovenue/web-sdk test

  rn:
    name: RN façade (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rovenue/react-native-sdk test
      - run: pnpm --filter @rovenue/react-native-sdk build

  flutter:
    name: Flutter façade (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter --version
      - name: Analyze + test each package
        run: |
          for p in rovenue_flutter_platform_interface rovenue_flutter rovenue_flutter_ios rovenue_flutter_android; do
            (
              cd packages/sdk-flutter/$p
              flutter pub get
              flutter analyze
              # rovenue_flutter_ios/_android have no test/ dir yet; `flutter
              # test` exits 1 (not 0) with "Test directory \"test\" not
              # found." on a package with none, so skip cleanly rather than
              # let the loop fail on a package that has nothing to test.
              if [ -d test ]; then
                flutter test
              else
                echo "no test/ directory for $p — skipping flutter test"
              fi
            ) || exit 1
          done
      - name: Analyze + test the example app
        working-directory: packages/sdk-flutter/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
          # integration_test needs a device; flutter-tester is the headless
          # one every runner has (it is also how these were run locally).
          flutter test -d flutter-tester integration_test

  # The plugin's NATIVE sources. `flutter analyze` above is a Dart analyzer —
  # it never compiles a line of HostApiImpl.kt or HostApiImpl.swift, so
  # without the two jobs below the Kotlin/Swift halves of this SDK (and their
  # unit tests) ship unbuilt. See spec §7 acceptance criterion 3.
  flutter-android-native:
    name: Flutter plugin (Android/Kotlin)
    runs-on: ubuntu-latest
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # The plugin module resolves the Flutter embedding artifact from
      # $FLUTTER_ROOT/bin/internal/engine.version (see its build.gradle), and
      # the composite build in its settings.gradle pulls packages/sdk-kotlin,
      # which needs the generated UniFFI bindings.
      - run: ./packages/core-rs/scripts/build-bindings.sh
      - name: gradle test (plugin unit tests)
        working-directory: packages/sdk-flutter/rovenue_flutter_android/android
        run: ./gradlew test --no-daemon --console=plain
      - name: Build the example's debug APK
        working-directory: packages/sdk-flutter/example
        run: flutter build apk --debug

  flutter-ios-native:
    name: Flutter plugin (iOS/Swift)
    runs-on: macos-14
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      # ios/Package.swift links FlutterMacOS.xcframework out of the Flutter
      # SDK cache; precache puts it there on a cold runner.
      - run: flutter precache --macos
      # ios/Package.swift depends on `packages/sdk-swift`, whose Package.swift
      # resolves RovenueFFI through `.binaryTarget(path:)`. That artifact is a
      # gitignored build product, so on a clean checkout SwiftPM aborts before
      # compiling anything: "local binary target 'RovenueFFI' … does not
      # contain a binary artifact". This script also regenerates the uniffi
      # bindings, which is why build-bindings.sh is no longer a separate step.
      - name: Build RovenueFFI.xcframework
        run: ./packages/sdk-swift/scripts/build-xcframework.sh
      - name: swift test (plugin unit tests)
        working-directory: packages/sdk-flutter/rovenue_flutter_ios/ios
        run: swift test
      # This job builds and runs the plugin's Swift unit tests; it does not
      # build the example app for iOS. Whether to add `flutter build ios` here
      # is an open decision, not a blocked one.

  # Four example apps live under examples/ (+ packages/sdk-flutter/example,
  # already built by the flutter job above). Nothing compiled them in CI
  # before this: examples/sample-rn-expo was found silently broken — it
  # imported a hook removed in the credit→virtual-currency rename — for
  # exactly that reason. These three jobs make "the examples build" an
  # enforced fact, not a claim.
  example-ios:
    name: Example app (iOS/SwiftUI)
    runs-on: macos-14
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # examples/ios-swift consumes packages/sdk-swift as a local SwiftPM
      # path dependency (XCLocalSwiftPackageReference), and that package's
      # Package.swift resolves RovenueFFI via `.binaryTarget(path:)`.
      # RovenueFFI.xcframework is a gitignored build product (see
      # packages/sdk-swift/.gitignore) — nowhere documented before this —
      # so on a fresh checkout SwiftPM cannot even resolve the package,
      # let alone build it, until this script produces the artifact. Same
      # sequence as the `swift` and `flutter-ios-native` jobs above.
      - name: Build RovenueFFI.xcframework
        run: ./packages/sdk-swift/scripts/build-xcframework.sh
      - name: Build the example app (iOS Simulator)
        run: |
          xcodebuild -project examples/ios-swift/RovenueExample.xcodeproj \
            -scheme RovenueExample \
            -destination 'generic/platform=iOS Simulator' \
            build

  example-android:
    name: Example app (Android/Compose)
    runs-on: ubuntu-latest
    needs: bindgen-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System build deps (rusqlite-bundled)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      # examples/android-kotlin consumes packages/sdk-kotlin as a Gradle
      # composite build (includeBuild + an explicit dependencySubstitution
      # in its settings.gradle.kts — see that file's header comment for why
      # the substitution rule is required, and do not remove or duplicate
      # it), which compiles sdk-kotlin from source and therefore needs the
      # generated UniFFI Kotlin bindings, same as the `kotlin` job above.
      - run: ./packages/core-rs/scripts/build-bindings.sh
      - name: Build the example app's debug APK
        working-directory: examples/android-kotlin
        run: ./gradlew assembleDebug --no-daemon --console=plain

  example-rn:
    name: Example app (RN/Expo, typecheck only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/sdk-rn's dist/ is gitignored — the example imports
      # "@rovenue/react-native-sdk" by its published entry points
      # (dist/index.d.ts etc.), so nothing resolves until it's built.
      - run: pnpm --filter @rovenue/react-native-sdk build
      # TYPECHECK ONLY — deliberately not a Metro bundle or a native build.
      # Two independent, pre-existing hazards (both documented in detail in
      # examples/sample-rn-expo/README.md) make either un-greenable:
      #   1. CocoaPods hoisting: ExpoModulesCore.podspec resolves the React
      #      Native version by shelling out to node from its own directory,
      #      which in this pnpm workspace finds the hoisted repo-root RN
      #      (0.86.x) instead of this app's pinned 0.74.5, baking the wrong
      #      REACT_NATIVE_TARGET_VERSION into the Pods project and failing
      #      to compile.
      #   2. Version skew: packages/sdk-rn declares peerDependencies on
      #      `expo >=52` / `react-native >=0.76`, while this example pins
      #      `expo ~51.0.0` / `react-native 0.74.5`. That skew hoists a
      #      newer @expo/cli to the repo root, which then requires Metro
      #      internals (e.g. "metro/src/lib/TerminalReporter") that the
      #      newer, hoisted `metro` package's "exports" map no longer
      #      exposes — so `expo export` / `react-native bundle` die in
      #      their own startup, before ever reading this app's source.
      # Both are repo-wide dependency-graph mismatches, not app bugs, and
      # aren't fixable by touching this example alone. `tsc --noEmit` is
      # the verifiable proxy: it resolves the SDK's real exported surface
      # and catches exactly the kind of "imported a removed hook" defect
      # that shipped here undetected — a job that skipped entirely would
      # be worse than this honest, narrower guarantee.
      - name: Typecheck the example
        working-directory: examples/sample-rn-expo
        run: pnpm exec tsc --noEmit -p tsconfig.json
