# Coordinated SDK release — publishes all five façades at the version currently
# committed in the repo (Rust crate, RN npm, Kotlin AAR, Swift pod, Flutter pub.dev
# packages). It does NOT bump versions: bump first (see scripts/sdk-parity.sh +
# the version parity test that locks all five to one number), merge, then run this.
#
# Manual-only by design — publishing is irreversible, so an operator triggers it
# from the Actions tab and ticks which artifacts to push. The `verify` gate runs
# the same checks as sdk.yml (incl. the 5-façade version parity test) so a
# version skew or red test blocks every publish job.
#
# Required repository secrets (publish jobs are skipped/fail clearly if unset):
#   CARGO_REGISTRY_TOKEN  — crates.io API token
#   NPM_TOKEN             — npm automation token (publish scope)
#   MAVEN_PUBLISH_URL     — e.g. https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/
#                           or  https://maven.pkg.github.com/rovenue/rovenue
#   MAVEN_PUBLISH_USER / MAVEN_PUBLISH_PASSWORD — Maven repo credentials
#   MAVEN_SIGNING_KEY / MAVEN_SIGNING_PASSWORD  — ASCII-armored GPG private key + passphrase (Central requires signed artifacts)
#   COCOAPODS_TRUNK_TOKEN — `pod trunk` session token
#   PUB_DEV_CREDENTIALS   — `dart pub token` / OAuth credentials JSON for pub.dev publishing
#
# NOTE (spec §4.6): rovenue_flutter_ios wraps the native `Rovenue` CocoaPod via
# a platform channel, so it cannot function on a real iOS install until that
# pod is live on Trunk. This is now enforced by the graph, not by caution:
# publish-flutter declares `needs: [verify, publish-swift]`, and publish-swift
# itself uploads the release artifacts, pins both checksums, lints and pushes
# to Trunk, and tags — all before it reports success. So a green publish-flutter
# run in this workflow does mean the Rovenue pod already shipped at this
# version.
name: release-sdk

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Publish Rust crate to crates.io"
        type: boolean
        default: true
      rn:
        description: "Publish RN package to npm"
        type: boolean
        default: true
      kotlin:
        description: "Publish Kotlin AAR to Maven"
        type: boolean
        default: true
      swift:
        description: "Publish Swift pod to CocoaPods Trunk"
        type: boolean
        default: true
      flutter:
        description: "Publish Flutter packages to pub.dev"
        type: boolean
        default: true

# publish-swift creates a GitHub Release for the Swift zips and pushes a
# podspec-sha256 pin commit back onto the branch that triggered the run.
permissions:
  contents: write

# Never run two releases concurrently.
concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  # ---- Gate: same checks as sdk.yml, including version parity across all 5 ----
  verify:
    name: Verify (tests + 5-façade version parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # version.test.ts asserts crate == RN == Kotlin == Swift == Flutter (all
      # four pubspecs); a skew fails here.
      - run: pnpm --filter @rovenue/react-native-sdk test

  publish-crate:
    name: Publish crate (crates.io)
    needs: verify
    if: ${{ inputs.crate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        run: cargo publish -p librovenue --manifest-path packages/core-rs/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-rn:
    name: Publish RN (npm)
    needs: verify
    if: ${{ inputs.rn }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rovenue/react-native-sdk build
      - name: npm publish
        working-directory: packages/sdk-rn
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-kotlin:
    name: Publish Kotlin (Maven)
    needs: verify
    if: ${{ inputs.kotlin }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      # Generates the Kotlin UniFFI binding the AAR compiles against.
      - run: ./packages/core-rs/scripts/build-bindings.sh
      # Cross-compile the native core for every Android ABI and stage it into
      # src/main/jniLibs (renamed to libuniffi_librovenue.so) so the published
      # AAR actually runs on-device. ubuntu-latest ships an NDK
      # (ANDROID_NDK_LATEST_HOME); build-android.sh adds the rust targets itself.
      - name: Cross-compile Android native libs
        run: |
          cargo install cargo-ndk --locked
          ./packages/core-rs/scripts/build-android.sh
      - name: gradle publish
        working-directory: packages/sdk-kotlin
        run: >
          gradle publishReleasePublicationToReleaseRepository --no-daemon
          -Provenue.publish.url="$MAVEN_PUBLISH_URL"
          -Provenue.publish.user="$MAVEN_PUBLISH_USER"
          -Provenue.publish.password="$MAVEN_PUBLISH_PASSWORD"
          -Provenue.signing.key="$MAVEN_SIGNING_KEY"
          -Provenue.signing.password="$MAVEN_SIGNING_PASSWORD"
        env:
          MAVEN_PUBLISH_URL: ${{ secrets.MAVEN_PUBLISH_URL }}
          MAVEN_PUBLISH_USER: ${{ secrets.MAVEN_PUBLISH_USER }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PUBLISH_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

  publish-swift:
    name: Publish Swift (CocoaPods + SwiftPM)
    needs: verify
    if: ${{ inputs.swift }}
    runs-on: macos-14
    # This job commits a podspec-sha256 pin back onto the branch and pushes
    # it, so it needs write access and an attached-branch checkout (default
    # actions/checkout leaves a detached HEAD, and `git push` with no
    # refspec fails from one).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      # 1. Build both artifacts. The script mutates nothing.
      - name: Build release artifacts
        working-directory: packages/sdk-swift
        run: ./scripts/release-pod.sh

      # 2. Upload before pinning: a checksum must describe a file that exists.
      - name: Create GitHub Release
        working-directory: packages/sdk-swift
        run: |
          VERSION=$(ruby -rjson -e "print JSON.parse(File.read('release.config.json'))['version']")
          gh release create "sdk-swift-v$VERSION" \
            "build/Rovenue-$VERSION.zip" \
            "build/RovenueFFI-$VERSION.xcframework.zip" \
            --title "sdk-swift v$VERSION" \
            --notes "Rovenue Swift façade $VERSION."
        env:
          GH_TOKEN: ${{ github.token }}

      # 3. Pin both checksums against the uploaded files.
      - name: Pin podspec sha256
        working-directory: packages/sdk-swift
        run: |
          VERSION=$(ruby -rjson -e "print JSON.parse(File.read('release.config.json'))['version']")
          SHA=$(shasum -a 256 "build/Rovenue-$VERSION.zip" | awk '{print $1}')
          sed -i'' -E "s/:sha256 => '[0-9a-fA-F]{64}'/:sha256 => '$SHA'/" Rovenue.podspec
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Rovenue.podspec
          git commit -m "chore(sdk-swift): pin Rovenue podspec sha256 for v$VERSION"
          git push

      # 4. Release lint runs against the now-live :http source — this is where
      #    `pod spec lint` belongs, and the only place it can pass.
      - name: pod spec lint
        working-directory: packages/sdk-swift
        run: pod spec lint Rovenue.podspec --allow-warnings --skip-tests

      - name: pod trunk push
        working-directory: packages/sdk-swift
        run: pod trunk push Rovenue.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

      # 5. Generate and push the SwiftPM distribution repository, then tag it
      #    LAST — a consumer resolving the tag must find the pinned checksum.
      - name: Publish SwiftPM distribution package
        working-directory: packages/sdk-swift
        run: |
          VERSION=$(ruby -rjson -e "print JSON.parse(File.read('release.config.json'))['version']")
          SLUG=$(ruby -rjson -e "print JSON.parse(File.read('release.config.json'))['repoSlug']")
          CHK=$(swift package compute-checksum "build/RovenueFFI-$VERSION.xcframework.zip")
          ./scripts/generate-swift-dist.sh "$CHK"
          cd build/swift-dist
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rovenue Swift SDK $VERSION"
          git tag "$VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${SLUG}-swift.git" HEAD:main --tags
        env:
          GH_TOKEN: ${{ secrets.SWIFT_DIST_REPO_TOKEN }}

  publish-flutter:
    name: Publish Flutter (pub.dev)
    # rovenue_flutter_ios depends on the `Rovenue` pod from Trunk, so the
    # Swift publish must land first. Previously a comment; now an edge.
    #
    # Effect: a run with swift: false skips this job too — a skipped `needs`
    # job fails the implicit success() gate GitHub Actions uses to decide
    # whether a dependent job runs. This is deliberate, not a bug: this repo
    # has never published anything, so the first release is swift+flutter
    # together, and a soft edge (e.g. `if: always() && !failure()`) would only
    # prove Swift didn't fail *in this run*, not that the pod is live on
    # Trunk at this version — the actual invariant rovenue_flutter_ios needs.
    # If you hit the skip and need Flutter alone: either re-run with
    # swift: true so publish-swift republishes in the same run, or — only
    # once you've independently confirmed the Rovenue pod is live on Trunk
    # at the pinned version — deliberately relax this edge.
    needs: [verify, publish-swift]
    if: ${{ inputs.flutter }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Configure pub.dev credentials
        # ubuntu-latest is Linux, where dart/pub reads credentials from
        # $XDG_CONFIG_HOME/dart/pub-credentials.json (falls back to
        # ~/.config/dart/pub-credentials.json) — see pub.dev's CI docs.
        run: |
          mkdir -p ~/.config/dart
          echo "$PUB_DEV_CREDENTIALS" > ~/.config/dart/pub-credentials.json
        env:
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}
      - name: Publish packages in dependency order
        run: |
          for p in rovenue_flutter_platform_interface rovenue_flutter_ios rovenue_flutter_android rovenue_flutter; do
            (cd packages/sdk-flutter/$p && dart pub publish --force) || exit 1
          done
