name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # apps/api/tests/setup.ts defaults REDIS_URL to this port. Several
      # BullMQ suites talk to a real Redis; none of them start their own.
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        # No `version:` input on purpose. It used to say `9` while
        # package.json said `pnpm@9.15.9`, which is two places to change and
        # one to forget. With the input omitted the action reads
        # `packageManager` from package.json, so the pin has one home.
      - uses: actions/setup-node@v4
        with:
          # Must satisfy the root package.json `engines.node` (>=22.7).
          # This said 20, so `pnpm install` refused on every run — CI had been
          # failing in under 20 seconds, before a single test executed.
          node-version: 24
          cache: pnpm

      # The integration suites need a Postgres with pg_partman, which no
      # stock image has — `services:` can only pull images, so the repo's own
      # image is built here and run by hand. tests/global-setup.ts builds its
      # template database from migrations alone, so an empty server is all
      # this has to be.
      - name: Start Postgres (repo image, pg_partman)
        run: |
          docker build -t rovenue-postgres:ci deploy/postgres
          docker run -d --name rovenue-pg -p 5433:5432 \
            -e POSTGRES_USER=rovenue \
            -e POSTGRES_PASSWORD=rovenue \
            -e POSTGRES_DB=rovenue \
            --health-cmd "pg_isready -U rovenue" \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            rovenue-postgres:ci
          for i in $(seq 1 40); do
            if docker exec rovenue-pg pg_isready -U rovenue >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"; exit 0
            fi
            sleep 3
          done
          echo "postgres never became ready"; docker logs rovenue-pg; exit 1

      - run: pnpm install --frozen-lockfile

      # Suppressions and the reason each one exists are documented in
      # docs/security/dependency-audit-suppressions.md. An advisory that
      # reaches a shipped image is fixed, never suppressed.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm build

      # apps/api's own `build` script (`tsup && tsc --noEmit`) typechecks
      # `src/**` but tsconfig.json's `include` never reaches `tests/**`, so
      # that tree went unchecked for a long time (see the header comment in
      # apps/api/tsconfig.tests.json). This runs it as its own step, through
      # turbo so packages without the script are skipped and dependency
      # types are already built by the `pnpm build` step above.
      - name: Typecheck - test tree
        run: pnpm exec turbo run typecheck:tests

      # apps/api/openapi/openapi.json is generated (apps/api/scripts/
      # generate-openapi.ts) from the live route table, Zod schemas and
      # apiKeyAuth() tags — nothing re-derives it automatically, so a zod
      # schema or route edited without re-running `openapi:generate` leaves
      # the committed file describing a request body the server no longer
      # accepts. `--check` rebuilds the document in memory and fails if it
      # differs from what's committed, without writing anything. The
      # apps/api/tests/openapi-contract.test.ts suite (run below, as part of
      # `pnpm test`) is the complementary guarantee: it fails by name when
      # the route table and openapi/responses.ts disagree about which
      # endpoints exist, independent of whether this step also catches it.
      - name: OpenAPI spec is up to date
        run: pnpm --filter @rovenue/api openapi:check

      # apps/docs/scripts/check-links.mjs validates every internal /docs/...
      # link (route exists) and every #fragment on one (the anchor actually
      # exists on the target page's rendered headings — same slugger fumadocs
      # uses), including the API explorer's ERROR_CATALOG-driven links, which
      # it cross-checks against the real generated api-errors page rather
      # than trusting the anchor-computation convention to stay in sync by
      # hand. Runs in well under a second; was written but never wired into
      # CI until now, so nothing enforced it on a PR.
      - name: Docs links + anchors are valid
        run: pnpm --filter @rovenue/docs check:links

      # scripts/sdk-doc-coverage.mjs measures documented-public-symbol
      # density per SDK and fails if any SDK regresses below the floor
      # recorded in scripts/sdk-doc-coverage.json. Was written but never
      # wired into CI until now — same class of gap as the check above.
      - name: SDK doc-coverage ratchet
        run: node scripts/sdk-doc-coverage.mjs

      # deploy/prometheus/tests/slo_test.yml feeds synthetic series through
      # the real rule file and asserts both directions — the alert fires on
      # the incident and stays quiet on a healthy service. It was written
      # alongside the rules and never run anywhere, so every threshold and
      # every `for:` in deploy/prometheus/rules/slo.yml was ungated: a rule
      # could be loosened to never fire, or tightened to page constantly, and
      # nothing on a PR would say so.
      #
      # This does NOT subsume apps/api/tests/prometheus-alert-rules.test.ts
      # (run below as part of `pnpm test`), and that is the point: promtool
      # supplies the series itself, so `check rules` AND `test rules` both
      # reported SUCCESS on a rule naming a metric the API never exports —
      # a rule that can never fire in production. The vitest contract test is
      # what catches that; this step catches the thresholds. Neither covers
      # the other.
      #
      # The image tag is read from docker-compose.yml rather than repeated
      # here, so the rules are always validated against the exact Prometheus
      # version that will load them.
      - name: Prometheus alert rules + Alertmanager config - syntax, thresholds, routing
        run: |
          set -euo pipefail
          image=$(grep -oE 'prom/prometheus:[^[:space:]"]+' docker-compose.yml | head -1)
          if [ -z "$image" ]; then
            echo "no prom/prometheus image pinned in docker-compose.yml" >&2
            exit 1
          fi
          echo "validating against $image"
          # Globbed, not enumerated. prometheus.yml loads rules/*.yml, so a
          # file listed by name here would let the NEXT rule file ship
          # unchecked — the CI step would stay green while Prometheus
          # refused to load the config and every alert in the deployment
          # went dark. Same for the tests directory.
          docker run --rm --entrypoint sh \
            -v "$PWD/deploy/prometheus:/p:ro" "$image" \
            -c 'promtool check rules /p/rules/*.yml'
          docker run --rm --entrypoint sh \
            -v "$PWD/deploy/prometheus:/p:ro" "$image" \
            -c 'for t in /p/tests/*_test.yml; do promtool test rules "$t" || exit 1; done'

          # The delivery path the rules above depend on. An Alertmanager
          # config that does not parse takes the container down at boot,
          # which takes every alert with it — and nothing else in CI reads
          # this file.
          am_image=$(grep -oE 'prom/alertmanager:[^[:space:]"]+' docker-compose.yml | head -1)
          if [ -z "$am_image" ]; then
            echo "no prom/alertmanager image pinned in docker-compose.yml" >&2
            exit 1
          fi
          echo "validating against $am_image"
          docker run --rm --entrypoint amtool \
            -v "$PWD/deploy/alertmanager:/a:ro" "$am_image" \
            check-config /a/alertmanager.yml

      # apps/api's `test` script is two passes: `vitest run` excludes the
      # testcontainer suites, then `VITEST_CONTAINER_PASS=1 vitest run` runs
      # them. The second pass starts its own Redpanda and ClickHouse; what it
      # cannot start is the Postgres above, which it clones a template
      # database from, one per vitest worker.
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://rovenue:rovenue@localhost:5433/rovenue
          REDIS_URL: redis://localhost:6380

      # Enforces only the VITE_* no-restricted-syntax rule from
      # eslint.config.mjs (spec §10's mechanism for keeping deployment-config
      # reads inside lib/runtime-config.ts). Deliberately narrow: the full
      # `eslint apps/dashboard/src` run is red on main today from pre-existing
      # react-hooks/exhaustive-deps + no-irregular-whitespace failures that
      # are out of scope here. See eslint.config.restricted-syntax.mjs.
      - name: Lint - VITE_* restricted syntax
        run: npx eslint -c eslint.config.restricted-syntax.mjs apps/dashboard/src
