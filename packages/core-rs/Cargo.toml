[package]
name = "librovenue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rovenue SDK core — shared business logic for Swift, Kotlin, React Native"

[lib]
name = "rovenue"
crate-type = ["cdylib", "staticlib", "rlib"]

# Reference generation (ROADMAP §11): `cargo doc --no-deps -p librovenue`
# builds fine locally with the default rlib target, but docs.rs builds every
# crate-type in `[lib]` unless told otherwise — cdylib/staticlib are opaque to
# rustdoc and would waste the docs.rs build budget for zero extra pages. No
# feature flags exist yet, so this only pins the doc target.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
uniffi = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cuid2 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
uuid = { version = "1.10", features = ["v4"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
