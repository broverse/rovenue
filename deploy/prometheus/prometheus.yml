global:
  scrape_interval: 15s
# Targets are pushed via Alloy remote_write; no scrape_configs needed here.

# SLO recording rules and alerts. The recording rules pre-compute the two
# SLIs at every window the burn-rate alerts need, so each alert divides the
# same two numbers rather than restating the query.
#
# There is no Alertmanager in docker-compose.yml, so nothing routes these to
# a pager on its own — they evaluate, and are queryable in Prometheus and
# alertable from Grafana's own contact points. Add an Alertmanager and an
# `alerting:` block here to page.
rule_files:
  - /etc/prometheus/rules/*.yml
